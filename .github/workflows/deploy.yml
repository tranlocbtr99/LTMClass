name: Deploy LTMClass
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltmclass-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Validate configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node -e "const fs=require('fs');if(fs.readFileSync('wrangler.jsonc','utf8').includes('REPLACE_AFTER_PROVISIONING'))process.exit(1)"
      - run: npx wrangler d1 migrations apply ltmclass --remote
      - run: npx wrangler deploy
